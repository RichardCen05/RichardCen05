<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Richard's AI product operating loop</title>
  <desc id="desc">Five connected stages: user signal, product decision, system brief, pilot evidence, and learning loop.</desc>
  <rect width="1200" height="230" rx="20" fill="#071F17"/>
  <text x="54" y="48" fill="#F3FFF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="700">My AI product operating loop</text>
  <text x="54" y="72" fill="#78A991" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Every tool is accountable to a decision, and every decision is accountable to evidence.</text>
