      <text x="0" y="46" text-anchor="middle" fill="#F3FFF8" font-size="14" font-weight="650">User signal</text>
      <text x="0" y="65" text-anchor="middle" fill="#78A991" font-size="11">interviews · workflow</text>
    </g>
