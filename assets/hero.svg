<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Richard Cen — AI Product Manager</title>
  <desc id="desc">A dark forest-green product signal board showing Richard's work moving from discovery through pilot validation.</desc>
  <defs>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020B08" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B6949"/>
      <stop offset="0.5" stop-color="#35D07F"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="1200" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="#071F17"/>
    <path d="M0 0H1200V82C960 118 742 20 472 64C287 94 142 131 0 105Z" fill="#0A2A1E"/>
    <circle cx="1095" cy="-18" r="186" fill="#0E3B2A"/>
    <circle cx="1095" cy="-18" r="126" fill="none" stroke="#1B6949" stroke-width="1" opacity="0.7"/>
    <circle cx="1095" cy="-18" r="82" fill="none" stroke="#35D07F" stroke-width="1" opacity="0.45"/>

    <g fill="none" stroke="#174C37" stroke-width="1" opacity="0.45">
      <path d="M70 286H1130"/>
      <path d="M70 370H1130"/>
      <path d="M70 286V370M282 286V370M494 286V370M706 286V370M918 286V370M1130 286V370"/>
    </g>

    <text x="70" y="56" fill="#78CFA2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2.2">RICHARD / PRODUCT SYSTEM / 2026</text>
    <rect x="934" y="38" width="196" height="34" rx="17" fill="#0A2A1E" stroke="#236447"/>
    <circle cx="958" cy="55" r="5" fill="#35D07F"/>
    <text x="974" y="60" fill="#CFFBE3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">OPEN TO OPPORTUNITIES</text>

    <text x="70" y="145" fill="#F3FFF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="750" letter-spacing="-2.4">Richard Cen</text>
    <text x="72" y="190" fill="#35D07F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="650" letter-spacing="0.5">AI PRODUCT MANAGER</text>
    <text x="72" y="229" fill="#C9E8D8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Turning complex workflows into human-centered AI products</text>
    <text x="72" y="257" fill="#78A991" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Discovery → technical PRD → cross-functional build → measurable pilot</text>

    <g filter="url(#depth)">
      <rect x="780" y="105" width="350" height="152" rx="16" fill="#0A2A1E" stroke="#1F5A41"/>
      <text x="806" y="134" fill="#78CFA2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">PRODUCT EVIDENCE</text>
      <text x="806" y="174" fill="#F3FFF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="720">35%</text>
      <text x="886" y="171" fill="#B4D8C5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">less food waste &amp; related loss</text>
      <text x="886" y="189" fill="#6F9D87" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Kulkita pilot · first 2 weeks</text>
      <path d="M806 207H1104" stroke="#174C37"/>
      <text x="806" y="238" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">IDR 26M FUNDING  ·  30+ AWARDS</text>
    </g>

    <path id="signalPath" d="M90 329H1110" fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#071F17" stroke="#35D07F" stroke-width="3">
      <circle cx="90" cy="329" r="8"/><circle cx="345" cy="329" r="8"/><circle cx="600" cy="329" r="8"/><circle cx="855" cy="329" r="8"/><circle cx="1110" cy="329" r="8"/>
    </g>
    <circle r="7" fill="#F3FFF8" stroke="#35D07F" stroke-width="4">
      <animateMotion dur="9s" repeatCount="indefinite" path="M90 329H1110" keyTimes="0;1" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
    <g fill="#9CCBB4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" text-anchor="middle">
      <text x="90" y="358">DISCOVER</text>
      <text x="345" y="358">FRAME</text>
      <text x="600" y="358">BUILD</text>
      <text x="855" y="358">EVALUATE</text>
      <text x="1110" y="358">PILOT</text>
    </g>
    <text x="70" y="400" fill="#456F5B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">BASED IN INDONESIA  /  OPEN TO INDONESIA · SINGAPORE · GLOBAL REMOTE</text>
  </g>
</svg>
