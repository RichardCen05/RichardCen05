<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Richard's AI product tool constellation</title>
  <desc id="desc">Moving once into place, the logo constellation groups AI, build, design, product, automation, and analytics tools.</desc>
  <defs>
    <style>
      .track-a{animation:settle-left 3.4s cubic-bezier(.16,1,.3,1) both}.track-b{animation:settle-right 3.7s .18s cubic-bezier(.16,1,.3,1) both}.track-c{animation:settle-left 4s .36s cubic-bezier(.16,1,.3,1) both}
