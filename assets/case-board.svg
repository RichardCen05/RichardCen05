<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Three AI products led by Richard Cen</title>
  <desc id="desc">Kulkita reduced food waste in a pilot, Sentra advanced accessible finance, and Fiona reached a client accounting pilot.</desc>
  <rect width="1200" height="520" rx="24" fill="#071F17"/>
