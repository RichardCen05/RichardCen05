    <text x="488" y="111" fill="#A7F3D0" font-size="28" font-weight="740">3rd</text><text x="488" y="190" fill="#F3FFF8" font-size="17" font-weight="650">Hackvidia</text><text x="488" y="216" fill="#78A991" font-size="15">Arkavidia · 2026</text>
